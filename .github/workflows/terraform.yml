name: Terraform

on:
  pull_request:
    branches: [main]
    paths: ['**.tf', '.github/workflows/terraform.yml', '.tflint.hcl']
  push:
    branches: [main]
    paths: ['**.tf', '.github/workflows/terraform.yml', '.tflint.hcl']

permissions:
  id-token: write      # OIDC
  contents: read
  pull-requests: write # PRコメント

env:
  TF_VERSION: "1.9.8"          # >= 1.6.0 を満たす固定版
  AWS_REGION: "ap-northeast-1"

jobs:
  lint:
    name: Lint & Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: terraform fmt
        run: terraform fmt -check -recursive -diff
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest
      - name: tflint
        run: |
          tflint --init
          tflint -f compact
      - name: Trivy IaC scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1

  plan:
    name: Plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: lint
    env:
      TF_VAR_keiba_db_backup_bucket_name: ${{ secrets.TF_VAR_keiba_db_backup_bucket_name }}
      TF_VAR_blog_images_bucket_name: ${{ secrets.TF_VAR_blog_images_bucket_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform init
      - name: Import existing S3 bucket if not in state
        run: terraform import aws_s3_bucket.keiba-db-backup "${{ secrets.TF_VAR_keiba_db_backup_bucket_name }}" 2>/dev/null || true
        continue-on-error: true
      - run: terraform validate
      - name: terraform plan
        id: plan
        run: terraform plan -no-color -input=false -out=tfplan
        continue-on-error: true
      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const output = `${{ steps.plan.outputs.stdout }}`;
            const out = `#### Terraform Plan \`${{ steps.plan.outcome }}\`
            <details><summary>Show Plan</summary>

            \`\`\`
            ${output}
            \`\`\`
            </details>`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: out
            });
      - name: Fail if plan errored
        if: steps.plan.outcome == 'failure'
        run: exit 1

  apply:
    name: Apply
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: lint
    environment: production   # 任意: 承認ゲートを付けたい場合に利用
    env:
      TF_VAR_keiba_db_backup_bucket_name: ${{ secrets.TF_VAR_keiba_db_backup_bucket_name }}
      TF_VAR_blog_images_bucket_name: ${{ secrets.TF_VAR_blog_images_bucket_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform init
      - name: Import existing S3 bucket if not in state
        run: terraform import aws_s3_bucket.keiba-db-backup "${{ secrets.TF_VAR_keiba_db_backup_bucket_name }}" 2>/dev/null || true
        continue-on-error: true
      - run: terraform plan -no-color -input=false -out=tfplan
      - run: terraform apply tfplan
